#cloud-config
# See the autoinstall documentation at:
# https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
# version 1
autoinstall:
  apt:
    disable_components: []
    fallback: offline-install
    geoip: true
    mirror-selection:
      primary:
      - country-mirror
      - arches: &id001
        - amd64
        - i386
        uri: http://archive.ubuntu.com/ubuntu/
      - arches: &id002
        - s390x
        - arm64
        - armhf
        - powerpc
        - ppc64el
        - riscv64
        uri: http://ports.ubuntu.com/ubuntu-ports
    preserve_sources_list: false
    security:
    - arches: *id001
      uri: http://security.ubuntu.com/ubuntu/
    - arches: *id002
      uri: http://ports.ubuntu.com/ubuntu-ports
  codecs:
    install: true
  drivers:
    install: true
  identity:
    hostname: bacon
    password: $6$.3qMTcQ7BrJ48Fal$AguILSgSmAPAr85ctUXNPIqTTd6GCI/YWY4D6vJut2UmeeUkDSzM0neL7qmhurDGPpRmMkKHRxIZDLdaLakgO.
    realname: lettuce
    username: lettuce
  kernel:
    package: linux-generic-hwe-24.04
  keyboard:
    layout: us
    toggle: null
    variant: ''
  locale: en_US.UTF-8
  network:
    ethernets:
      enp0s25:
        match:
          macaddress: 54:ee:75:6b:72:a4
        set-name: enp0s25
    version: 2
    wifis: {}
  oem:
    install: auto
  snaps:
    - name: remmina
      channel: stable
      classic: false
    - name: thunderbird
      channel: stable
      classic: false
  packages:
    #install git
    - git
    - btop
    - adb
    - 7zip
    - fastfetch
    - gnome-software-plugin-flatpak
    - bridge-utils
    - qpdf
    - ffmpegthumbnailer
    - gnome-sushi
    - virt-manager
    - grsync
    - qemu-system-x86
    - pdfcrack
    - libopengl0
    - gnome-tweaks
    - calibre
    - intel-gpu-tools
    - ffmpeg
    - libvirt-daemon-system
    - vlc
  source:
    id: ubuntu-desktop-minimal
    search_drivers: true
  ssh:
    allow-pw: true
    authorized-keys: []
    install-server: false
  storage:
    config:
    - ptable: gpt
      serial: TEAM_TM8PS7256G_TPBF2210040010102380
      path: /dev/sda
      wipe: superblock-recursive
      preserve: false
      name: ''
      grub_device: false
      id: disk-sda
      type: disk
    - device: disk-sda
      size: 1127219200
      wipe: superblock
      flag: boot
      number: 1
      preserve: false
      grub_device: true
      offset: 1048576
      path: /dev/sda1
      id: partition-0
      type: partition
    - fstype: fat32
      volume: partition-0
      preserve: false
      id: format-0
      type: format
    - device: disk-sda
      size: 2147483648
      wipe: superblock
      number: 2
      preserve: false
      offset: 1128267776
      path: /dev/sda2
      id: partition-1
      type: partition
    - fstype: ext4
      volume: partition-1
      preserve: false
      id: format-1
      type: format
    - device: disk-sda
      size: 252783362048
      wipe: superblock
      number: 3
      preserve: false
      offset: 3275751424
      path: /dev/sda3
      id: partition-2
      type: partition
    - volume: partition-2
      keyfile: /tmp/luks-key-ule_sksh
      recovery_keyfile: null
      path: /dev/mapper/dm_crypt-0
      preserve: false
      id: dm_crypt-0
      type: dm_crypt
    - name: ubuntu-vg
      devices:
      - dm_crypt-0
      preserve: false
      id: lvm_volgroup-0
      type: lvm_volgroup
    - name: ubuntu-lv
      volgroup: lvm_volgroup-0
      size: 252765536256B
      wipe: superblock
      preserve: false
      path: /dev/ubuntu-vg/ubuntu-lv
      id: lvm_partition-0
      type: lvm_partition
    - fstype: ext4
      volume: lvm_partition-0
      preserve: false
      id: format-2
      type: format
    - path: /
      device: format-2
      id: mount-2
      type: mount
    - path: /boot
      device: format-1
      id: mount-1
      type: mount
    - path: /boot/efi
      device: format-0
      id: mount-0
      type: mount
  timezone: Africa/Nairobi
  updates: security
  version: 1