#cloud-config
# See the autoinstall documentation at:
# https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
# version 1
autoinstall:
  apt:
    disable_components: []
    fallback: offline-install
    geoip: true
    mirror-selection:
      primary:
      - country-mirror
      - arches: &id001
        - amd64
        - i386
        uri: http://archive.ubuntu.com/ubuntu/
      - arches: &id002
        - s390x
        - arm64
        - armhf
        - powerpc
        - ppc64el
        - riscv64
        uri: http://ports.ubuntu.com/ubuntu-ports
    preserve_sources_list: false
    security:
    - arches: *id001
      uri: http://security.ubuntu.com/ubuntu/
    - arches: *id002
      uri: http://ports.ubuntu.com/ubuntu-ports
  codecs:
    install: true
  drivers:
    install: true
  identity:
    hostname: bacon
    password: $6$.3qMTcQ7BrJ48Fal$AguILSgSmAPAr85ctUXNPIqTTd6GCI/YWY4D6vJut2UmeeUkDSzM0neL7qmhurDGPpRmMkKHRxIZDLdaLakgO.
    realname: lettuce
    username: lettuce
  kernel:
    package: linux-generic-hwe-24.04
  keyboard:
    layout: us
    toggle: null
    variant: ''
  locale: en_US.UTF-8
  storage:
    layout:
      name: lvm
  network:
    version: 2
    ethernets:
      eth-default:
        match:
          name: en*
        dhcp4: true
  oem:
    install: auto
  snaps:
    - name: remmina
      channel: stable
      classic: false
    - name: thunderbird
      channel: stable
      classic: false
  packages:
    #install git
    - git
    - btop
    - adb
    - 7zip
    - fastfetch
    - gnome-software-plugin-flatpak
    - bridge-utils
    - qpdf
    - ffmpegthumbnailer
    - gnome-sushi
    - virt-manager
    - grsync
    - qemu-system-x86
    - pdfcrack
    - libopengl0
    - gnome-tweaks
    - calibre
    - intel-gpu-tools
    - ffmpeg
    - libvirt-daemon-system
    - vlc
  source:
    id: ubuntu-desktop-minimal
    search_drivers: true
  ssh:
    allow-pw: true
    authorized-keys: []
    install-server: false
  storage:
    layout:
      name: lvm
  timezone: Africa/Nairobi
  updates: security
  version: 1